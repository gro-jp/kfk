[package]
name = "kfk-web"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "kfk: the web interface: read-only pages and a live terminal on each node (Axum, Maud, HTMX)"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
libc = "0.2"
maud = { version = "0.27", features = ["axum"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "sync"] }
kfk-engine = { path = "../kfk-engine" }
kfk-logs = { path = "../kfk-logs" }
kfk-mizan = { path = "../kfk-mizan" }
kfk-report = { path = "../kfk-report" }
kfk-store = { path = "../kfk-store" }
kfk-term = { path = "../kfk-term" }
kfk-usage = { path = "../kfk-usage" }
kfk-util = { path = "../kfk-util" }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
