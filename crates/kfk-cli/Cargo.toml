[package]
name = "kfk-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "kfk: a chief of staff, orchestrators on demand and short-lived agents for Claude Code, with one local state store"

[[bin]]
name = "kfk"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde_json = "1"
kfk-engine = { path = "../kfk-engine" }
kfk-logs = { path = "../kfk-logs" }
kfk-mizan = { path = "../kfk-mizan" }
kfk-web = { path = "../kfk-web" }
kfk-report = { path = "../kfk-report" }
kfk-store = { path = "../kfk-store" }
kfk-token = { path = "../kfk-token" }
kfk-usage = { path = "../kfk-usage" }
kfk-util = { path = "../kfk-util" }
